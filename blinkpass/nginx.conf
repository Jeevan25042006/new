server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;

    # WebSocket upgrade map
    set $connection_upgrade "";
    if ($http_upgrade = "websocket") {
        set $connection_upgrade "Upgrade";
    }

    location /api/ {
        proxy_pass http://localhost:8005/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /auth/ {
        proxy_pass http://localhost:8005/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /oauth2/ {
        proxy_pass http://localhost:8005/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /.well-known/ {
        proxy_pass http://localhost:8005/.well-known/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /user/ {
        proxy_pass http://localhost:8005/user/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /identity/ {
        proxy_pass http://localhost:8005/identity/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /credentials/ {
        proxy_pass http://localhost:8005/credentials/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /developer/ {
        proxy_pass http://localhost:8005/developer/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /docs {
        proxy_pass http://localhost:8005/docs;
        proxy_set_header Host $host;
    }

    location = /redoc {
        proxy_pass http://localhost:8005/redoc;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://localhost:8005/openapi.json;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
